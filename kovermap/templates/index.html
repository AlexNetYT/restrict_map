<!doctype html>
{% load static %}
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf-token" content="{{ csrf_token }}" />
    <link rel="stylesheet" href="{% static 'kovermap/styles.css' %}" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'leaflet/leaflet.css' %}" />


    <title>Kover Map</title>
  </head>
  <body>
    <header class="page_header">
      <div class="page_header_text">
        <div class="page_kicker">оперативный мониторинг</div>
        <h1>Kover Map</h1>
      </div>
      <div class="page_header_actions">
        <div class="page_header_status">
          <span class="status-pill status-pill-live">live</span>
          <span class="header-meta">данные обновляются регулярно</span>
        </div>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Переключить тему">
          <span class="theme-toggle__icon" aria-hidden="true">☀️</span>
        </button>
      </div>
    </header>

    <div class="status_ticker" aria-live="polite">
      <div class="ticker_track" id="ticker_track_line">
        <div class="ticker_content" id="ticker_original_content">
          <span class="ticker_item"><span class="ticker_label">Открыто</span> <strong id="ticker-open">0</strong></span>
          <span class="ticker_item"><span class="ticker_label">Закрыто</span> <strong id="ticker-closed">0</strong></span>
          <span class="ticker_item"><span class="ticker_label">Ограничения</span> <strong id="ticker-restricted">0</strong></span>
          <span class="ticker_item"><span class="ticker_label">Активные КО</span> <strong id="ticker-ko-active">0</strong></span>
          <span class="ticker_item"><span class="ticker_label">Предстоящие КО</span> <strong id="ticker-ko-upcoming">0</strong></span>
          <span class="ticker_item"><span class="ticker_label">Обновлено</span> <strong id="ticker-last-update">—</strong></span>
          <span class="ticker_item"><span class="ticker_label">⚠️ Не используйте эти данные для подготовки к полёту.</span></span>
        </div>
      </div>
    </div>
    <button
      type="button"
      id="mobile-map-toggle"
      class="mobile-map-toggle"
      data-mobile-map-open-class="mobile-map-open"
      aria-label="Показать карту"
    >
      <span aria-hidden="true">🗺️</span>
      <span>Карта</span>
    </button>
    <div class="central_block">
        <div class="left_panel">
            <div class="panel_tabs">
                <button class="panel-tab active" id="tab-airports">✈️ Аэропорты</button>
                <button class="panel-tab" id="tab-ko">🛡️ Ограничения (КО)</button>
                <button class="panel-tab" id="tab-rte">🗺️ Маршрут</button>
            </div>
            
            <!-- Airports Content -->
            <div class="tab_content active" id="content-airports">
                <div class="search_panel">
                    <input 
                        type="text" 
                        id="search-input" 
                        placeholder="🔍 Поиск по названию или ICAO..." 
                        class="search-input"
                    >
                    <div class="quick_filter_row" aria-label="Быстрые фильтры статусов">
                        <button type="button" class="quick-filter-btn active" data-status="">Все</button>
                        <button type="button" class="quick-filter-btn" data-status="OPEN">Открыто</button>
                        <button type="button" class="quick-filter-btn" data-status="CLOSED">Закрыто</button>
                        <button type="button" class="quick-filter-btn" data-status="RESTRICTED">Ограничения</button>
                    </div>
                    
                </div>
                <ul class="airports_list">
                    <!-- Airports will be loaded by JavaScript -->
                </ul>

            </div>

            <!-- KO restrictions Content -->
            <div class="tab_content" id="content-ko">
                <div class="search_panel">
                    <input 
                        type="text" 
                        id="ko-search-input" 
                        placeholder="🔍 Поиск по RVM / описанию..." 
                        class="search-input"
                    >
                    <div class="filter_controls ko_filters">
                        <select id="ko-category-filter" class="status-filter" style="width: 50%;">
                            <option value="">Все типы КО</option>
                            <option value="full_closure">Полное закрытие</option>
                            <option value="partial_closure">Частичное закрытие</option>
                            <option value="route">Маршруты</option>
                        </select>
                        <select id="ko-status-filter" class="status-filter" style="width: 50%;">
                            <option value="">Все статусы</option>
                            <option value="active">Активные</option>
                            <option value="upcoming">Предстоящие</option>
                        </select>
                    </div>
                    <div class="filter_controls">
                        <select id="ko-fir-filter" class="status-filter" style="width: 100%;">
                            <option value="">Все FIR (районы УВД)</option>
                            <!-- FIRs will be loaded by JS -->
                        </select>
                    </div>
                </div>
                <ul class="ko_list">
                    <!-- KO restrictions will be loaded by JavaScript -->
                </ul>
            </div>
            <div class="tab_content" id="content-rte">
                <div class="rte_panel">
                    <input 
                        type="text" 
                        id="rte-input" 
                        placeholder="🔍 Введите маршрут." 
                        class="search-input"
                    >
                    <button id="rte-btn" class="rte-btn" title="Обновить статусы">➡️</button>
                </div>
                <div class="route-legs-list" style="overflow-x: hidden; overflow-y: auto;">
                    <div class="empty-message" style="color: #94a3b8; font-size: 12px; text-align: center; padding: 10px;">Маршрут не задан</div>
                </div>
            </div>
        </div>
        <div class="map_module" id="map">
            <button type="button" class="mobile-map-close" id="mobile-map-close" aria-label="Закрыть карту">✕</button>
        </div>
    </div>
    
    <div id="route-warnings" style="display: none; margin-top: 8px; font-size: 12px; color: #ef4444; background: #fef2f2; padding: 8px; border-radius: 4px;"></div>
    <script src="{% static 'leaflet/leaflet-global.js' %}"></script>
    <script src="{% static 'kovermap/map.js' %}"></script>
  </body>
</html>
